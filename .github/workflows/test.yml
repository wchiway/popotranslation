name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Build solution
        run: msbuild popotranslation.slnx -restore -target:Build -property:Configuration=Debug -property:Platform=x64

      - name: Test core
        run: dotnet test tests/PopoTranslation.Core.Tests/PopoTranslation.Core.Tests.csproj --configuration Debug

      - name: Test infrastructure
        run: dotnet test tests/PopoTranslation.Infrastructure.Tests/PopoTranslation.Infrastructure.Tests.csproj --configuration Debug

      - name: Test providers
        run: dotnet test tests/PopoTranslation.Providers.Tests/PopoTranslation.Providers.Tests.csproj --configuration Debug

      - name: Run Windows checks
        run: dotnet run --project tests/PopoTranslation.Windows.Tests/PopoTranslation.Windows.Tests.csproj --configuration Debug

      - name: Test release scripts
        run: python -I -B -m unittest discover -s scripts -p "test_*.py" -v

      - name: Test repository checks
        run: python -I -B -m unittest discover -s tests -p "test_*.py" -v
