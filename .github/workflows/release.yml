name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v, e.g. 1.2.3 or 1.2.3-rc.1'
        required: true
        type: string
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options:
          - release
          - prerelease

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  test:
    if: ${{ github.event_name != 'push' || (github.event.created && !github.event.deleted) }}
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build:
    needs: test
    runs-on: windows-2025-vs2026
    steps:
      - name: Validate request
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'push') {
            if (-not $env:TAG_NAME.StartsWith('v')) { throw 'Expected a v-prefixed tag.' }
            $env:VERSION = $env:TAG_NAME.Substring(1)
            $env:CHANNEL = if ($env:VERSION.Contains('-')) { 'prerelease' } else { 'release' }
          } else {
            $env:VERSION = $env:INPUT_VERSION
            $env:CHANNEL = $env:INPUT_CHANNEL
          }
          if ($env:VERSION.Length -gt 100 -or $env:VERSION -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$') {
            throw 'Version must be a three-part SemVer version without build metadata or a v prefix.'
          }
          $parts = $env:VERSION.Split('-', 2)[0].Split('.')
          foreach ($part in $parts) {
            $number = 0
            if (-not [int]::TryParse($part, [ref]$number) -or $number -gt 65535) { throw 'Version components must fit in 0..65535.' }
          }
          $suffix = $Matches[4]
          if ($suffix) {
            foreach ($identifier in $suffix.Split('.')) {
              if ($identifier -cmatch '^[0-9]+$' -and $identifier.Length -gt 1 -and $identifier[0] -eq '0') { throw 'Numeric prerelease identifiers cannot have leading zeroes.' }
            }
          }
          if ($env:CHANNEL -ceq 'release' -and $suffix) { throw 'A release version cannot have a prerelease suffix.' }
          if ($env:CHANNEL -ceq 'prerelease' -and -not $suffix) { throw 'A prerelease version must have a prerelease suffix.' }
          if ($env:CHANNEL -cnotin @('release', 'prerelease')) { throw 'Unknown release channel.' }
          "APP_VERSION=$($parts -join '.')" >> $env:GITHUB_ENV
          "VERSION=$env:VERSION" >> $env:GITHUB_ENV

      - name: Checkout selected commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          global-json-file: global.json

      - name: Locate build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere is missing.' }
          $msbuildPaths = @(& $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe')
          if ($LASTEXITCODE -ne 0) { throw "vswhere failed with exit code $LASTEXITCODE." }
          $msbuild = $msbuildPaths | Select-Object -First 1
          if (-not $msbuild -or -not (Test-Path -LiteralPath $msbuild)) { throw 'Visual Studio MSBuild is missing.' }
          if (-not (Get-Command dotnet -ErrorAction SilentlyContinue)) { throw '.NET SDK is missing.' }
          "MSBUILD_PATH=$msbuild" >> $env:GITHUB_ENV

      # Official download and verification instructions checked 2026-10-29:
      # https://jrsoftware.org/isdl.php and https://jrsoftware.org/isdl-verify.php
      - name: Download and verify Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP 'inno-download'
          $install = Join-Path $env:RUNNER_TEMP 'inno-compiler'
          if ((Test-Path -LiteralPath $download) -or (Test-Path -LiteralPath $install)) { throw 'Inno Setup directories already exist.' }
          New-Item -ItemType Directory -Path $download, $install | Out-Null
          $installer = Join-Path $download 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(^|,\s*)CN=Pyrsys B\.V\.(,|$)') { throw 'Inno Setup Authenticode verification failed.' }
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/PORTABLE=1', '/CURRENTUSER', '/NOICONS', '/TASKS=', "/DIR=`"$install`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed.' }
          $iscc = Join-Path $install 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'ISCC.exe is missing.' }
          $compilerVersion = & $iscc --version
          if ($LASTEXITCODE -ne 0 -or "$compilerVersion" -notmatch '\b7\.1\.0\b') { throw 'Unexpected Inno Setup compiler version.' }
          "ISCC_PATH=$iscc" >> $env:GITHUB_ENV

      - name: Publish x64 self-contained application and build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publish = Join-Path $env:RUNNER_TEMP 'popo-publish'
          $output = Join-Path $env:RUNNER_TEMP 'popo-setup'
          $artifacts = Join-Path $env:RUNNER_TEMP 'popo-artifacts'
          foreach ($path in @($publish, $output, $artifacts)) {
            if (Test-Path -LiteralPath $path) { throw "Output path already exists: $path" }
          }
          New-Item -ItemType Directory -Path $output, $artifacts | Out-Null
          & $env:MSBUILD_PATH popotranslation.csproj -restore -target:Publish -property:Configuration=Release -property:Platform=x64 -property:WindowsAppSDKSelfContained=true "-property:Version=$env:VERSION" "-property:PublishDir=$publish\"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath (Join-Path $publish 'popotranslation.exe'))) { throw 'Application publish failed.' }
          $unsafe = Get-ChildItem -LiteralPath $publish -Recurse -Force | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $_.Name -match '(?i)^(settings\.json|preferences\.json|\.env($|\.)|logs$|secrets$)|\.(db|sqlite|sqlite3)(-|$)|\.log$|\.secrets\.json$|\.(pfx|p12)$' }
          if ($unsafe) { throw 'Publish output contains potentially sensitive files or reparse points.' }
          & $env:ISCC_PATH /NI "/DPublishDir=$publish" "/DAppVersion=$env:APP_VERSION" "/O$output" installer/PopoTranslation.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
          $setup = Join-Path $output "PopoTranslation.$env:APP_VERSION.Setup.x64.exe"
          if (-not (Test-Path -LiteralPath $setup)) { throw 'Expected installer was not generated.' }
          Copy-Item -LiteralPath $setup -Destination (Join-Path $artifacts "PopoTranslation.$env:VERSION.Setup.x64.exe")
          Compress-Archive -Path (Join-Path $publish '*') -DestinationPath (Join-Path $artifacts "PopoTranslation-$env:VERSION-win-x64.zip")
          Get-ChildItem -LiteralPath $artifacts -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content -LiteralPath (Join-Path $artifacts 'SHA256SUMS.txt') -Encoding utf8

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: ${{ runner.temp }}/popo-artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: ${{ github.event_name == 'push' && github.event.created && !github.event.deleted }}
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - name: Checkout complete history and tags
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download tested build
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-files
          path: release-files

      - name: Verify existing tag and release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_AFTER: ${{ github.event.after }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $base = "https://api.github.com/repos/$env:GH_REPO"
          $ref = Invoke-RestMethod -Uri "$base/git/ref/tags/$env:TAG" -Headers $headers
          $raw = $ref.object.sha
          if ($ref.object.type -cnotin @('tag', 'commit')) { throw 'Tag does not refer to a commit or annotated tag.' }
          $localRaw = (git rev-parse --verify "refs/tags/$env:TAG")
          if ($LASTEXITCODE -ne 0 -or $localRaw -cne $raw) { throw 'Local and remote tag objects differ.' }
          $target = (git rev-parse --verify "refs/tags/$env:TAG^{commit}")
          if ($LASTEXITCODE -ne 0 -or $target -cne $env:COMMIT_SHA) { throw 'Tag does not point to the tested commit.' }
          $head = (git rev-parse HEAD)
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:COMMIT_SHA) { throw 'Checkout does not match the tested commit.' }
          git merge-base --is-ancestor $env:COMMIT_SHA refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The tested commit must be an ancestor of main.' }
          if ($env:EVENT_AFTER -cne $raw -and $env:EVENT_AFTER -cne $target) { throw 'Tag no longer matches the push event.' }
          try {
            Invoke-RestMethod -Uri "$base/releases/tags/$env:TAG" -Headers $headers | Out-Null
            throw 'A release already exists for this tag.'
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }
          "TAG_OBJECT=$raw" >> $env:GITHUB_ENV

      - name: Generate release description with DeepSeek
        shell: pwsh
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:TAG
          python -I -B scripts/release_commit_range.py --commit $env:COMMIT_SHA --tag $tag --output "$env:RUNNER_TEMP/commits.json" --metadata "$env:RUNNER_TEMP/range.json"
          if ($LASTEXITCODE -ne 0) { throw 'Could not determine the release commit range.' }
          python -I -B scripts/generate_release_notes.py --commits "$env:RUNNER_TEMP/commits.json" --output "$env:RUNNER_TEMP/release-notes.md"
          if ($LASTEXITCODE -ne 0) { throw 'DeepSeek release description generation failed.' }

      - name: Publish release for existing tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:TAG
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $base = "https://api.github.com/repos/$env:GH_REPO"
          try {
            Invoke-RestMethod -Uri "$base/releases/tags/$tag" -Headers $headers | Out-Null
            throw "Release already exists: $tag"
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }
          # Recheck the tag range after generation; outside publishers may have changed it.
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GH_TOKEN"))
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $encoded"
          try {
            git fetch --force --prune --prune-tags --tags origin
            if ($LASTEXITCODE -ne 0) { throw 'Could not refresh tags.' }
          } finally {
            Remove-Item Env:GIT_CONFIG_COUNT, Env:GIT_CONFIG_KEY_0, Env:GIT_CONFIG_VALUE_0 -ErrorAction SilentlyContinue
          }
          python -I -B scripts/release_commit_range.py --commit $env:COMMIT_SHA --tag $tag --output "$env:RUNNER_TEMP/commits-recheck.json" --metadata "$env:RUNNER_TEMP/range-recheck.json"
          if ($LASTEXITCODE -ne 0) { throw 'Could not recheck the release commit range.' }
          if ((Get-FileHash "$env:RUNNER_TEMP/range.json").Hash -ne (Get-FileHash "$env:RUNNER_TEMP/range-recheck.json").Hash -or
              (Get-FileHash "$env:RUNNER_TEMP/commits.json").Hash -ne (Get-FileHash "$env:RUNNER_TEMP/commits-recheck.json").Hash) { throw 'Release commit range changed during generation; rerun the workflow.' }
          $ref = Invoke-RestMethod -Uri "$base/git/ref/tags/$tag" -Headers $headers
          $localRaw = (git rev-parse --verify "refs/tags/$tag")
          if ($LASTEXITCODE -ne 0 -or $ref.object.sha -cne $env:TAG_OBJECT -or $localRaw -cne $env:TAG_OBJECT) { throw 'Tag moved during the workflow.' }
          $target = (git rev-parse --verify "refs/tags/$tag^{commit}")
          if ($LASTEXITCODE -ne 0 -or $target -cne $env:COMMIT_SHA) { throw 'Tag no longer points to the tested commit.' }
          $files = @(Get-ChildItem -LiteralPath 'release-files' -File | ForEach-Object { $_.FullName })
          if ($files.Count -ne 3) { throw 'Expected installer, application archive, and checksums.' }
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Add-Content -LiteralPath $notesPath -Encoding utf8 -Value "`n`n---`n安装器显示三段数字基础版本。应用和安装包未进行 Authenticode 签名；自动化测试不能替代干净机器上的安装、升级、卸载和运行验证。"
          $arguments = @('release', 'create', $tag) + $files + @('--verify-tag', '--title', $tag, '--notes-file', $notesPath)
          if ($tag.Contains('-')) { $arguments += '--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; a draft release may remain and must be inspected manually.' }
